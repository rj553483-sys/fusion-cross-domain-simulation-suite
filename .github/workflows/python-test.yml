name: Cross-Domain Verification CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-cross-domain-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Master Cross-Domain Verification Pipeline
      run: |
        python -m src.cross_domain_orchestrator

    - name: Validate Residual Error Tolerances (< 0.1%)
      run: |
        python -c "import json; data=json.load(open('data/master_system_verification.json')); assert data['global_convergence_status']=='CONVERGED'; print('CI/CD Verification Passed')"
